name: CI/CD - Build & Deploy

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '18.x'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    name: Build & Test .NET + Angular

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Restore NuGet packages
        run: dotnet restore

      - name: Build .NET solution
        run: dotnet build --configuration Release --no-restore

      - name: Run Unit Tests
        run: dotnet test tests/Domain.UnitTests/Domain.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Run Application Unit Tests
        run: dotnet test tests/Application.UnitTests/Application.UnitTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Run Functional Tests
        run: dotnet test tests/Application.FunctionalTests/Application.FunctionalTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" || true

      - name: Run Integration Tests
        run: dotnet test tests/Infrastructure.IntegrationTests/Infrastructure.IntegrationTests.csproj --configuration Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx" || true

      - name: Install Angular dependencies
        run: npm ci
        working-directory: src/Web/ClientApp

      - name: Build Angular
        run: npm run build -- --configuration production
        working-directory: src/Web/ClientApp

      - name: Publish .NET application
        run: |
          dotnet publish src/Web/Web.csproj \
            --configuration Release \
            --output ${{ github.workspace }}/publish \
            --no-build

      - name: Copy Angular dist to publish folder
        run: |
          mkdir -p ${{ github.workspace }}/publish/wwwroot
          cp -r src/Web/ClientApp/dist/* ${{ github.workspace }}/publish/wwwroot/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: published-app
          path: ${{ github.workspace }}/publish

  deploy-to-azure:
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    name: Deploy to Azure App Service

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: published-app
          path: ${{ github.workspace }}/deploy

      - name: Azure Login
        uses: azure/login@v1
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Deploy to App Service
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ secrets.AZURE_APP_NAME }}
          package: ${{ github.workspace }}/deploy
          slot-name: production

      - name: Configure App Settings
        run: |
          az webapp config appsettings set \
            --resource-group ${{ secrets.AZURE_RESOURCE_GROUP }} \
            --name ${{ secrets.AZURE_APP_NAME }} \
            --settings \
              "ConnectionStrings:DailyToolsDb=${{ secrets.SQL_CONNECTION_STRING }}" \
              "ASPNETCORE_ENVIRONMENT=Production"

      - name: Logout from Azure
        run: az logout
